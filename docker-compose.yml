services:
  api:
    image: python:3.12-slim
    working_dir: /app/apps/api
    volumes:
      - .:/app
    environment:
      - MOCK_LLM=true
      - LLM_API_KEY=
      - LLM_BASE_URL=https://api.deepseek.com/v1
      - LLM_MODEL=deepseek-v4-pro
      - DATABASE_URL=mysql+pymysql://root:123456@host.docker.internal:3306/softbei?charset=utf8mb4
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
  web:
    image: node:22-alpine
    working_dir: /app/apps/web
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

  # MCP Server 单端口单容器：17 个工具聚合在一个 FastMCP（POST /mcp + GET /ping），
  # 端口 8080，与 AgentArts 运行时/自定义接入契约一致。
  # 镜像构建见 apps/mcp/Dockerfile，构建上下文必须为仓库根目录。
  # 公网部署与登记手册见 docs/agentarts/07-MCP 配置手册.md。
  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    image: zhixing-mcp:latest
    container_name: zhixing-mcp
    restart: unless-stopped
    # 容器内通过 host.docker.internal 访问宿主机上的 MySQL / Neo4j；
    # 云上部署时在根目录 .env 中覆盖为云数据库地址（见手册 §3）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MOCK_LLM: ${MOCK_LLM:-true}
      MCP_HOST: "0.0.0.0"
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-INFO}
      # 独立部署（ECS/隧道）默认 local 模式：设 MCP_ACCESS_TOKEN 后强制 Bearer 校验，
      # 留空则无鉴权（仅限安全组白名单联调）。接入 AgentArts 运行时网关时改 platform。
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-local}
      MCP_ACCESS_TOKEN: ${MCP_ACCESS_TOKEN:-}
      # 关系库：默认连宿主机 MySQL；本机 MySQL 未启动时可在 .env 中改为
      # sqlite（仅 profile/assessment 联调，路径需落在挂载卷上）：
      #   MCP_DATABASE_URL=sqlite:////data/mcp/mcp.db
      DATABASE_URL: ${MCP_DATABASE_URL:-mysql+pymysql://root:123456@host.docker.internal:3306/softbei?charset=utf8mb4}
      MCP_AUTO_INIT_DB: ${MCP_AUTO_INIT_DB:-false}
      # 图数据库：graph 工具强依赖 Neo4j，不可用 sqlite 替代
      NEO4J_URI: ${MCP_NEO4J_URI:-bolt://host.docker.internal:7687}
      NEO4J_USER: ${MCP_NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${MCP_NEO4J_PASSWORD:-}
    volumes:
      - ./data/mcp:/data
    ports:
      - "${MCP_PORT:-8080}:8080"
