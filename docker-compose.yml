services:
  api:
    image: python:3.12-slim
    working_dir: /app/apps/api
    volumes:
      - .:/app
    environment:
      - MOCK_LLM=true
      - LLM_API_KEY=
      - LLM_BASE_URL=https://api.deepseek.com/v1
      - LLM_MODEL=deepseek-v4-pro
      - DATABASE_URL=mysql+pymysql://root:123456@host.docker.internal:3306/softbei?charset=utf8mb4
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
  web:
    image: node:22-alpine
    working_dir: /app/apps/web
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

  # 三个 MCP Server 单镜像：profile(8100) / graph(8101) / assessment(8102)
  # 镜像构建见 apps/mcp/Dockerfile，构建上下文必须为仓库根目录。
  # 部署手册见 docs/agentarts/06-MCP 配置手册.md。
  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    image: zhixing-mcp-servers:latest
    container_name: zhixing-mcp
    restart: unless-stopped
    # 容器内通过 host.docker.internal 访问宿主机上的 MySQL / Neo4j；
    # 云上部署时在根目录 .env 中覆盖为云数据库地址（见手册 §3）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MOCK_LLM: "true"
      MCP_HOST: "0.0.0.0"
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-INFO}
      # 关系库：默认连宿主机 MySQL；本机 MySQL 未启动时可在 .env 中改为
      # sqlite（仅 profile/assessment 联调，路径需落在挂载卷上）：
      #   MCP_DATABASE_URL=sqlite:////data/mcp/mcp.db
      DATABASE_URL: ${MCP_DATABASE_URL:-mysql+pymysql://root:123456@host.docker.internal:3306/softbei?charset=utf8mb4}
      MCP_AUTO_INIT_DB: ${MCP_AUTO_INIT_DB:-false}
      # 图数据库：graph-server 强依赖 Neo4j，不可用 sqlite 替代
      NEO4J_URI: ${MCP_NEO4J_URI:-bolt://host.docker.internal:7687}
      NEO4J_USER: ${MCP_NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${MCP_NEO4J_PASSWORD:-}
      # 仅当 AgentArts 接入支持自定义 Header 时才在 .env 设置该值；留空则不启用鉴权
      MCP_ACCESS_TOKEN: ${MCP_ACCESS_TOKEN:-}
    volumes:
      - ./data/mcp:/data
    ports:
      - "8100:8100"
      - "8101:8101"
      - "8102:8102"
