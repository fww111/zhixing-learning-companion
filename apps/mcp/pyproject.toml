[project]
name = "zhixing-mcp-servers"
version = "0.1.0"
description = "MCP servers exposing the personalized-learning business layer (profile/graph/assessment) to Huawei Cloud AgentArts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42",
    "neo4j>=5.20",
    "httpx>=0.27",
    "numpy>=1.26",
    "fastapi>=0.110",
    "pydantic[email]>=2.7",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_servers"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
